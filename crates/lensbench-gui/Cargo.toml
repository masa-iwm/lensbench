[package]
name = "lensbench-gui"
description = "Windows GUI of lensbench (single exe, no install)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# eframe 0.37 が 1.95 を要る
rust-version.workspace = true


[lints]
workspace = true

[features]
# Windows のアプリ内のブラウザ（wry・tao。webview.rs）。切ると品ページは既定のブラウザで開く。
# CI の Windows のテストは --no-default-features で切る（windows クレート一式をテストのビルドに乗せない）
default = ["webview", "gpu"]
webview = ["dep:wry", "dep:tao"]
# Huygens の和を GPU で（wgpu。GPU が無ければ CPU）
gpu = ["lensbench-analysis/gpu"]

[lib]
name = "lensbench_gui"
path = "src/lib.rs"

[[bin]]
name = "lensbench-gui"
path = "src/main.rs"

[dependencies]
lensbench-formats = { path = "../lensbench-formats" }
# カタログの仕様の条件・単位
lensbench-project = { path = "../lensbench-project" }
lensbench-catalog = { path = "../lensbench-catalog" }
lensbench-design = { path = "../lensbench-design" }
lensbench-core = { path = "../lensbench-core" }
lensbench-lang = { path = "../lensbench-lang" }
# 計算は serve と同じ API（lensbench_engine::Session）をプロセス内で呼ぶ
lensbench-engine = { path = "../lensbench-engine" }
# 組み込みの解析の結果の型（図が読む）
lensbench-analysis = { path = "../lensbench-analysis" }
lensbench-cad = { path = "../lensbench-cad" }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
serde = { version = "1", features = ["derive"] }
eframe = { version = "0.37", default-features = false, features = ["clipboard", "default_fonts", "glow", "links", "persistence", "x11"] }
# Linux の GUI は CI（xvfb の x11）用なので wayland は入れない（Wayland の机でも XWayland で動く）
# clipboard・links は eframe 0.32 から既定の機能に分かれた（default-features = false では切れるので明示する）
# 絵文字（🔍 など）のフォント。egui 0.37 から既定のフォントに入らなくなった（0.31 と同じ絵文字を出す）
egui = { version = "0.37", default-features = false, features = ["monochrome_emoji_fonts"] }
egui_extras = { version = "0.37", default-features = false }
# パネルのドッキング・タブ・フロート（並びは serde で保存）
egui_dock = { version = "0.22", features = ["serde"] }
egui_plot = "0.38"
# 日本語のフォントの寸法（文字の縦位置の補正。egui と同じ読み方）
ab_glyph = "0.2"
# OS の言語（画面の言語の既定）
sys-locale = "0.3"
# 通し確認（--tour）の画面を PNG に書く
png = "0.17"
# 時計（wasm の std::time::Instant は使えない）
web-time = "1"
# 設定の読み込み（eframe の保存と同じ RON、eframe と同じ版）。egui_dock 0.16 の並びを書き換えてから読み直す
ron = "0.12"

# ネイティブだけ（wasm の Web 版では使えない）
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# 配る exe で読み上げ（Windows の UI Automation・Linux の AT-SPI）に画面の木を渡す（eframe の accesskit 機能）。
# Web 版は eframe 0.37 では使わないので入れない
eframe = { version = "0.37", default-features = false, features = ["accesskit"] }
# 大きな配列の確保を OS に返さず使い回す（Windows の既定のヒープは追跡ごとにページを取り直して遅い）
mimalloc = { version = "0.1", default-features = false }

# Web 版
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement", "HtmlAnchorElement", "Blob", "Url", "Worker", "WorkerOptions", "WorkerType", "MessageEvent", "MessagePort", "MessageChannel", "BroadcastChannel", "Location", "UrlSearchParams", "ErrorEvent", "Event", "console"] }
# ブラウザの言語（navigator.language）
sys-locale = { version = "0.3", features = ["js"] }

# ファイルを選ぶ窓（wasm はブラウザのファイル選択、files.rs）。Linux は zenity を呼ぶ（rfd の xdg-portal は
# zbus など 55 クレートを引く。Linux の GUI は CI 用）
[target.'cfg(not(target_os = "linux"))'.dependencies]
rfd = "0.15"

# 未完のカタログ品の品ページを開くアプリ内のブラウザ（WebView2。別のプロセスで動かす、webview.rs）。feature webview
[target.'cfg(windows)'.dependencies]
# ファイルの窓の持ち主（本体の HWND を rfd に渡す、files.rs）
raw-window-handle = "0.6"
wry = { version = "0.57", default-features = false, optional = true }
tao = { version = "0.37", default-features = false, features = ["rwh_06"], optional = true }

# exe のアイコン（Windows のリソース）
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
# 画面の振る舞いのテスト。窓も GPU も使わず、AccessKit の木でボタンを探して押す
egui_kittest = { version = "0.37", features = ["eframe"] }
