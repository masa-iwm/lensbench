[package]
name = "lensbench-core"
description = "Sequential ray tracing core of lensbench"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# 結合テストは下の [[test]]（tests/it.rs）にまとめる
autotests = false


[lints]
workspace = true

[dependencies]
miniz_oxide = "0.9"
num-complex = "0.4"
rustfft = "6"
rayon = "1"
# 時計（ネイティブは std::time::Instant そのまま。wasm の std::time::Instant は使えない）
web-time = "1"
serde = { version = "1", features = ["derive"], optional = true }
schemars = { version = "1", optional = true }

[features]
# System などを serde で書き出し・読み直す（Python の pickle に使う）
serde = ["dep:serde", "serde/rc", "num-complex/serde"]
# 系ファイルの JSON スキーマ: serde の型から schemars でスキーマを作る
schema = ["serde", "dep:schemars"]

[dev-dependencies]
criterion = { version = "0.5", default-features = false }
ndarray = "0.16"
ndarray-npy = "0.9"
serde_json = "1"

# 速さを測る examples だけ。wasm の試験（wasm32-wasip1）では C を作れないので外す
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
mimalloc = { version = "0.1", default-features = false }

[[bench]]
name = "trace"
harness = false

# 結合テストは tests/it.rs の 1 つの exe にまとめる（ファイルごとの exe を作らない。公開 #216 BLD-03）
[[test]]
name = "it"
path = "tests/it.rs"

[[test]]
name = "batch"
path = "tests/batch.rs"
