[package]
name = "lensbench-core"
description = "Sequential ray tracing core of lensbench"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# 結合テストは下の [[test]]（tests/it.rs）にまとめる
autotests = false


[lints]
workspace = true

[dependencies]
miniz_oxide = "0.9"
# .zmx・AGF などの文字コード（UTF-8 でない ANSI のファイル: Shift_JIS・Windows-1252）
encoding_rs = "0.8"
num-complex = { version = "0.4", features = ["serde"] }
rustfft = "6"
rayon = "1"
# System などの serde での書き出し・読み直し（システムファイル・Python の pickle）と、JSON スキーマ（schemars）。常に有効
serde = { version = "1", features = ["derive", "rc"] }
schemars = "1"

# OS の言語（誤りの文の言語の既定、i18n.rs）。wasm は GUI が言語を決める
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
sys-locale = "0.3"

[dev-dependencies]
# .zmx の書き出しで読み直す試験（書き手は lensbench-formats。dev の依存なので循環にならない）
lensbench-formats = { path = "../lensbench-formats" }
criterion = { version = "0.5", default-features = false }
ndarray = "0.16"
ndarray-npy = "0.9"
serde_json = "1"

# 速さを測る examples だけ。wasm の試験（wasm32-wasip1）では C を作れないので外す
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
mimalloc = { version = "0.1", default-features = false }

[[bench]]
name = "trace"
harness = false

[[bench]]
name = "usershape"
harness = false

# 結合テストは tests/it.rs の 1 つの exe にまとめる（ファイルごとの exe を作らない）
[[test]]
name = "it"
path = "tests/it.rs"

[[test]]
name = "batch"
path = "tests/batch.rs"
