[package]
name = "lensbench-py"
description = "Python bindings of lensbench"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

# maturin でビルドする拡張モジュール。ワークスペースのメンバー（target・Cargo.lock・プロファイルを共有する。
# pyo3 の abi3 は Python なしで check・ビルドできる。.cargo/config.toml の PYO3_BUILD_EXTENSION_MODULE）


[lints]
workspace = true

[lib]
name = "lensbench"
# rlib は別の拡張モジュール（形式・プラグインを足した版）から init_module を呼ぶ用
crate-type = ["cdylib", "rlib"]
# テストは tests/（pytest）
test = false
doctest = false

[features]
# 拡張モジュールの入口（PyInit_lensbench）を作る。別の拡張モジュールに組み込むときは
# default-features = false にして、その側の #[pymodule] から init_module を呼ぶ
default = ["module"]
module = []

[dependencies]
lensbench-core = { path = "../lensbench-core", features = ["serde"] }
lensbench-analysis = { path = "../lensbench-analysis" }
lensbench-project = { path = "../lensbench-project" }
lensbench-design = { path = "../lensbench-design" }
lensbench-verify = { path = "../lensbench-verify" }
numpy = "0.30"
pyo3 = { version = "0.30", features = ["abi3-py39"] }
serde_json = "1"
# 大きな配列の確保を OS に返さず使い回す。入口を作るとき（module）だけ global_allocator にする
mimalloc = { version = "0.1", default-features = false }

