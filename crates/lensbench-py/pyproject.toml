[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "lensbench"
description = "Python bindings of the lensbench sequential ray tracer"
license = "MIT OR Apache-2.0"
requires-python = ">=3.9"
dependencies = ["numpy>=1.21"]
dynamic = ["version"]

[tool.maturin]
module-name = "lensbench"
