[package]
name = "lensbench-analysis"
description = "Analyses of lensbench: one typed definition per analysis (spot, wavefront, Zernike, MTF, PSF, RMS, ghost), plus the plugin adapters"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# 結合テストは下の [[test]]（tests/it.rs）にまとめる
autotests = false


[lints]
workspace = true

[dependencies]
lensbench-formats = { path = "../lensbench-formats" }
lensbench-core = { path = "../lensbench-core" }
# 解析ごとの設定・結果の型（serde）と、そのスキーマ（CLI の引数・serve・GUI の欄・ドキュメントを作る）
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
schemars = "1"
rayon = "1"
rustfft = "6"

[dev-dependencies]
ndarray = "0.16"
ndarray-npy = "0.9"

# 速さを測る examples だけ。wasm の試験（wasm32-wasip1）では C を作れないので外す
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
mimalloc = { version = "0.1", default-features = false }

[[test]]
name = "it"
path = "tests/it.rs"
