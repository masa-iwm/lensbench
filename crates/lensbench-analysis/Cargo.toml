[package]
name = "lensbench-analysis"
description = "Analyses of lensbench: one typed definition per analysis (spot, wavefront, Zernike, MTF, PSF, RMS, ghost), plus the plugin adapters"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true


[lints]
workspace = true

[dependencies]
lensbench-core = { path = "../lensbench-core" }
# 解析ごとの設定・結果の型（serde）と、そのスキーマ（CLI の引数・serve・GUI の欄・ドキュメントを作る）
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
schemars = "1"
