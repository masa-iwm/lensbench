[package]
name = "lensbench-design"
description = "Merit function terms, Monte Carlo tolerancing and catalog-lens swap search of lensbench (JSON settings and results)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# 結合テストは下の [[test]]（tests/it.rs）にまとめる
autotests = false

[lints]
workspace = true

[dependencies]
lensbench-core = { path = "../lensbench-core", features = ["serde", "schema"] }
lensbench-analysis = { path = "../lensbench-analysis" }
lensbench-project = { path = "../lensbench-project" }
serde = { version = "1", features = ["derive"] }
schemars = "1"
serde_json = { version = "1", features = ["float_roundtrip"] }

[dev-dependencies]
jsonschema = { version = "0.60", default-features = false }

[[test]]
name = "it"
path = "tests/it.rs"
