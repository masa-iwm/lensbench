[package]
name = "lensbench-export"
description = "Layout and trace result export of lensbench (SVG, PNG, DXF, glTF, OBJ, STL, STEP, CSV, JSON, npz)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# 結合テストは下の [[test]]（tests/it.rs）にまとめる
autotests = false


[lints]
workspace = true

[dependencies]
lensbench-core = { path = "../lensbench-core" }
png = "0.17"
serde_json = { version = "1", features = ["preserve_order"] }
# 品の STEP の読み（測りと同じ表で写す）
lensbench-step = { path = "../lensbench-step" }

[dev-dependencies]
lensbench-formats = { path = "../lensbench-formats" }
ndarray = "0.16"
ndarray-npy = "0.9"
lensbench-project = { path = "../lensbench-project" }

# 結合テストは tests/it.rs の 1 つの exe にまとめる（ファイルごとの exe を作らない）
[[test]]
name = "it"
path = "tests/it.rs"
