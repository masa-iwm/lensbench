[package]
name = "lensbench-cli"
description = "Command line interface of lensbench"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "lensbench"
path = "src/main.rs"

[dependencies]
lensbench-core = { path = "../lensbench-core" }
lensbench-project = { path = "../lensbench-project" }
clap = { version = "4", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
serde_json = "1"
