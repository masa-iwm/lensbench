[package]
name = "lensbench-project"
description = "Block-based project files of lensbench and their expansion to sequential surfaces"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# 結合テストは下の [[test]]（tests/it.rs）にまとめる
autotests = false


[lints]
workspace = true

[dependencies]
lensbench-formats = { path = "../lensbench-formats" }
lensbench-core = { path = "../lensbench-core" }
rayon = "1"
ciborium = "0.2"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
# JSON スキーマ（docs/schema）
schemars = "1"
# float_roundtrip: 数を JSON から読むときに丸めない（書いた値と同じ f64 に戻る。serve の set の値も）
serde_json = { version = "1", features = ["float_roundtrip"] }
# gzip で圧縮したカタログ（.json.gz）を読む
flate2 = "1"

[dev-dependencies]
lensbench-analysis = { path = "../lensbench-analysis" }
# スキーマで例題を検査
jsonschema = { version = "0.60", default-features = false }

# 結合テストは tests/it.rs の 1 つの exe にまとめる（ファイルごとの exe を作らない）
[[test]]
name = "it"
path = "tests/it.rs"

# 例外: 同梱のガラスカタログの往復は別の exe（このプロセスで読んだ AGF が候補になるので、tests/glass を読む it と分ける）
[[test]]
name = "builtin_glass"
path = "tests/builtin_glass.rs"
