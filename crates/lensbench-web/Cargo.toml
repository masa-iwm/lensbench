[package]
name = "lensbench-web"
description = "Web version of the lensbench GUI (wasm, runs in the browser)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

# ブラウザで動かす GUI の入口。wasm32-unknown-unknown でビルドして wasm-bindgen にかける
# （scripts/build_web.sh、docs/web.md）。ネイティブでは中身の無いライブラリ

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# ファイルの束（gzip）の展開（unpack_gz）
flate2 = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
lensbench-core = { path = "../lensbench-core" }
lensbench-gui = { path = "../lensbench-gui" }
lensbench-engine = { path = "../lensbench-engine" }
lensbench-cad = { path = "../lensbench-cad" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement"] }
js-sys = "0.3"
wasm-bindgen-rayon = { version = "1.3", optional = true }

[features]
# wasm を画面用（gui: JS の口 start）と計算の Web Worker 用（worker: worker_*・monitor_*）に分けて作る（GAR-11）。
# 片方だけにすると、使わない側のコード（画面なら計算、Worker なら egui の描画）がリンクで落ちて小さくなる。
# 既定は両方（cargo check・clippy・1 つの wasm で試すとき）。scripts/build_web.sh は分けて作る
default = ["gui", "worker"]
gui = []
worker = []
# 並列: Web Worker の中で rayon のスレッドを使う。nightly と atomics のビルドが要る（scripts/build_web.sh）
threads = ["worker", "dep:wasm-bindgen-rayon"]
