[workspace]
resolver = "2"
members = ["crates/lensbench-core", "crates/lensbench-project", "crates/lensbench-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/masa-iwm/lensbench"
