[workspace]
resolver = "2"
members = ["crates/lensbench-core", "crates/lensbench-analysis", "crates/lensbench-project", "crates/lensbench-verify", "crates/lensbench-export", "crates/lensbench-cli", "crates/lensbench-gui", "crates/lensbench-web"]
exclude = ["crates/lensbench-py"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/masa-iwm/lensbench"
rust-version = "1.80"

[profile.release]
lto = "thin"
codegen-units = 1

# CI のテスト用: release と同じ最適化（opt-level 3、数値は release と同じ）で、LTO なし・並列コンパイルにして
# ビルドを速くする（windows のテストが 12 分かかっていた）。`cargo test --profile ci`
[profile.ci]
inherits = "release"
lto = false
codegen-units = 16
incremental = false
