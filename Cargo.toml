[workspace]
resolver = "2"
members = ["crates/lensbench-core", "crates/lensbench-analysis", "crates/lensbench-project", "crates/lensbench-design", "crates/lensbench-verify", "crates/lensbench-export", "crates/lensbench-cad", "crates/lensbench-engine", "crates/lensbench-cli", "crates/lensbench-gui", "crates/lensbench-web", "crates/lensbench-py"]
exclude = ["third_party/winit", "third_party/branches"]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/masa-iwm/lensbench"
# 実際に使う版（rust-toolchain.toml で固定）。古い版での検査はしない（個人利用）
rust-version = "1.100"

# ワークスペース共通の lint（各クレートは [lints] workspace = true）。clippy の -D warnings は CI のコマンドライン
[workspace.lints.clippy]
# 数値の式は添字のループの方が読みやすい所が多い（行列・格子・波長と面の二重ループ）ので止める（BLD-30）
needless_range_loop = "allow"

[profile.release]
lto = "thin"
codegen-units = 1

# CI のテスト用: release と同じ最適化（opt-level 3、数値は release と同じ）で、LTO なし・並列コンパイルにして
# ビルドを速くする（windows のテストが 12 分かかっていた）。`cargo test --profile ci`
[profile.ci]
inherits = "release"
lto = false
codegen-units = 16
incremental = false
# 添字・個数の計算のオーバーフローをテストで見つける（浮動小数の結果は変わらない。配る release には入れない）
overflow-checks = true

# Windows で拡大率の違うモニターの間を引きずると窓の大きさが飛ぶ winit 0.30 の不具合を直した版（third_party/winit/LENSBENCH.md）
[patch.crates-io]
winit = { path = "third_party/winit" }
# nightly で止まる branches 0.3（truck → rclite が使う）の build.rs を外した版（third_party/branches/LENSBENCH.md）
branches = { path = "third_party/branches" }
