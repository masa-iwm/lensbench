# 外のクレートから lensbench に解析・プラグインを足す雛形。別のリポジトリでは、これを写して始める。
# 公開のリポジトリの中では lensbench-sdk を path で参照し、公開 CI が組む（SDK を壊す変更を止める）。
# 写したら下の lensbench-sdk（3 か所）と末尾の [patch.crates-io] の 2 行を、同じ git のタグ（または rev）に替え、
# 公開リポジトリの同じタグの rust-toolchain.toml を写す（README の「リポジトリの外へ写す」）:
#   lensbench-sdk = { git = "https://github.com/masa-iwm/lensbench", tag = "v0.9.0", features = [...] }
#   winit = { git = "https://github.com/masa-iwm/lensbench", tag = "v0.9.0" }
[package]
name = "lensbench-extension-example"
version = "0.1.0"
edition = "2021"
publish = false

# 公開のワークスペースには入れない（外のリポジトリと同じく単独で組む）
[workspace]

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "example-cli"
path = "src/bin/cli.rs"

[[bin]]
name = "example-gui"
path = "src/bin/gui.rs"
required-features = ["gui"]

[features]
default = []
# GUI（ネイティブの exe。wasm では Web 版の画面用）
gui = ["lensbench-sdk/gui"]
# Python の拡張モジュール（import 名は lensbench。公開の wheel と同じ環境に入れない）。wheel（cdylib）を組むときだけ付ける。
# exe は py なしで組む（py を付けた lib は Python のシンボルが要るので、exe に繋ぐとリンクで落ちる）
py = ["lensbench-sdk/py"]
# Web 版の計算の Web Worker 用（threads はスレッドありの版）。公開の scripts/build_web.sh が gui・worker・threads を
# 1 つずつ選んで wasm を作る
worker = ["lensbench-sdk/web-worker"]
threads = ["lensbench-sdk/web-threads"]

[dependencies]
# egui・pyo3・serde・schemars・wasm-bindgen は直接依存せず、SDK の再輸出を使う（版がずれると型が合わない）
lensbench-sdk = { path = "../../crates/lensbench-sdk" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
lensbench-sdk = { path = "../../crates/lensbench-sdk", features = ["cli"] }
# アロケータは入口を作る側（このクレート）で決める。SDK は決めない（公開の exe・wheel と同じ mimalloc。src/lib.rs）
mimalloc = { version = "0.1", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
lensbench-sdk = { path = "../../crates/lensbench-sdk", features = ["web"] }

# 公開のリポジトリと同じ設定（git 依存からは伝わらないので写す）
[profile.release]
lto = "thin"
codegen-units = 1

[profile.ci]
inherits = "release"
lto = false
codegen-units = 16
incremental = false
overflow-checks = true

# 直した winit・branches（公開リポジトリの third_party）。外では git のタグで引く（cargo がリポジトリの中から同じ名前の
# クレートを探す）。相対パスのままだと写した先で見つからない
[patch.crates-io]
winit = { path = "../../third_party/winit" }
branches = { path = "../../third_party/branches" }
