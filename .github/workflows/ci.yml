name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  public-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: python3 scripts/check_public.py --history

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # テストは ci プロファイル（release と同じ最適化、LTO なしで速くビルド。Cargo.toml）
      - run: cargo test --workspace --profile ci
      # GUI の exe（インストール不要の 1 ファイル）を成果物に置く。PR では ci プロファイル（テストのビルドを
      # 使い回す）、main への push では配る形の release
      - if: runner.os == 'Windows' && github.event_name != 'push'
        run: cargo build --profile ci -p lensbench-gui
      - if: runner.os == 'Windows' && github.event_name == 'push'
        run: |
          cargo build --release -p lensbench-gui
          mkdir -p target/ci
          cp target/release/lensbench-gui.exe target/ci/
        shell: bash
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v6
        with:
          name: lensbench-gui-windows
          path: target/ci/lensbench-gui.exe

  # ドキュメントサイト（mdBook）: CLI の例を実際に走らせて図を作り、本が組めるかを確かめる（GUI の画面・Rust API は Pages で）
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.4.52
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install numpy matplotlib
      - run: cargo build --profile ci -p lensbench-cli
      - run: python scripts/gen_docs.py --cli target/ci/lensbench
      - run: python scripts/docs_examples.py target/ci/lensbench
      - run: mdbook build -d target/book

  # GUI の画面の通し確認: 仮想ディスプレイで起動し、開く → 解析 → カタログ → 組合せ → 系 → 解析を
  # 自分で操作して各画面を撮る。途中でエラーが出れば失敗。画面は成果物 gui-tour に置く
  gui-tour:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y xvfb libxkbcommon-x11-0 libgl1 libegl1 libgl1-mesa-dri fonts-noto-cjk
      - run: cargo build --profile ci -p lensbench-gui
      - run: >-
          xvfb-run -a -s "-screen 0 1400x900x24"
          target/ci/lensbench-gui --tour gui-tour
          --glass-dir tests/glass --lens-catalog examples/lenses/LB examples/projects/P8_catalog_two.json
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: gui-tour
          path: gui-tour

  # 書き出しの読み戻し: CLI で書いた SVG・glTF・STEP・CSV・JSON を別の実装（XML・trimesh・OpenCascade）で
  # 読み、形・座標（GLRS）・追跡の値を .zmx と OpticStudio の基準（tests/refs）と照合する
  export-readback:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --profile ci -p lensbench-cli
      - run: python -m pip install -r tests/readback/requirements.txt
      - run: python -m pytest -q tests/readback

  # Web 版: wasm でビルドし、配る形のフォルダを作って Chromium で起動を確かめる。フォルダは成果物
  # lensbench-web（GitHub Pages への公開は pages.yml）
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      # スレッドありの版（mt/）は nightly の build-std で作る（scripts/build_web.sh の NIGHTLY と同じ版）
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-15
          targets: wasm32-unknown-unknown
          components: rust-src
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # wasm-bindgen-cli は Cargo.lock の wasm-bindgen と同じ版
      - run: |
          v=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')
          echo "WASM_BINDGEN=$v" >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@${{ env.WASM_BINDGEN }}
      - run: cargo clippy --target wasm32-unknown-unknown -p lensbench-web -p lensbench-gui -- -D warnings
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install fonttools
      - run: scripts/build_web.sh target/web
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: npm install --no-save playwright@1.55.0 && npx playwright install --with-deps chromium
      # スレッドあり（ヘッダーあり）・GitHub Pages と同じ（ヘッダーなし、coi.js で付け直す）・1 スレッド（?st）
      - run: EXPECT_MT=1 node scripts/web_smoke.mjs target/web web-smoke.png
      - run: HEADERS=0 EXPECT_MT=1 node scripts/web_smoke.mjs target/web web-smoke-coi.png
      - run: ST=1 node scripts/web_smoke.mjs target/web web-smoke-st.png
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lensbench-web
          path: |
            target/web
            web-smoke*.png

  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            crates/lensbench-py -> target
      - run: cargo fmt --manifest-path crates/lensbench-py/Cargo.toml --check
      - run: cargo clippy --manifest-path crates/lensbench-py/Cargo.toml --all-targets -- -D warnings
      - run: cargo build --release -p lensbench-cli
      - run: python -m pip install "maturin>=1.9,<2" numpy pytest mypy
      - run: maturin build --release -m crates/lensbench-py/Cargo.toml -o dist
      - run: python -m pip install --no-index --find-links dist lensbench
      - run: python -m pytest -q crates/lensbench-py/tests
      # 型スタブ: 実行時のモジュールとの照合と、例題の型検査
      - run: python -m mypy.stubtest lensbench --allowlist crates/lensbench-py/stubtest-allowlist.txt
      - run: python -m mypy --strict examples/python
      # serve の Python クライアントと解析ループの例。例は 1 回の往復の時間を出す
      - run: python -m pytest -q clients/python/tests
      - run: python examples/loop/serve_loop.py
      - uses: actions/upload-artifact@v6
        with:
          name: wheel-${{ matrix.os }}
          path: dist/*.whl
