name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  # main への push で、マージした PR の CI の結果を見る（pr-tested）
  actions: read
  pull-requests: read

jobs:
  # main への push（PR のマージ）で、マージした結果の木が PR の head の木と同じ（PR が main に追いついていた）で、
  # その head の PR の CI が通っていれば、同じ中身の検査（test・docs・gui-tour・export-readback・web・python）を
  # もう一度回さない。main が先に進んでいて組み合わせが PR で試されていないときは全部回す。
  # 履歴の検査（public-check）と配る exe のビルド（gui-windows）はいつも回す
  pr-tested:
    runs-on: ubuntu-24.04
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          # 判定に失敗したら（API の失敗など）飛ばさずに全部回す
          check() {
            local tree before head
            tree=$(gh api "repos/$REPO/commits/$SHA" --jq .commit.tree.sha) || return 1
            before=$(gh api "repos/$REPO/commits/$SHA" --jq '.parents[0].sha') || return 1
            for head in $(gh api "repos/$REPO/commits/$SHA/pulls" --jq '.[].head.sha') ; do
              [ "$(gh api "repos/$REPO/commits/$head" --jq .commit.tree.sha)" = "$tree" ] || continue
              # マージ前の main の先端が head の祖先（PR が main に追いついていた）。PR の CI が試した
              # 「その時の main と head のマージ」の木が head の木と同じになる条件（後で main が戻された場合を除く）
              [ "$(gh api "repos/$REPO/compare/$before...$head" --jq .behind_by)" = 0 ] || continue
              n=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?event=pull_request&status=success&head_sha=$head" --jq .total_count) || continue
              if [ "${n:-0}" -gt 0 ]; then
                echo "::notice::PR の head ${head:0:7} と同じ木で、その CI が通っているので 重複する検査を飛ばす"
                return 0
              fi
            done
            return 1
          }
          if check; then echo "skip=true" >> "$GITHUB_OUTPUT"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi

  public-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: python3 scripts/check_public.py --history

  test:
    needs: pr-tested
    if: ${{ !cancelled() && needs.pr-tested.outputs.skip != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Windows はテストの 100 近い exe のリンクが重いので、MSVC の link.exe でなく同梱の rust-lld でリンクする
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: rust-lld
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # テストは ci プロファイル（release と同じ最適化、LTO なしで速くビルド。Cargo.toml）
      - run: cargo test --workspace --profile ci

  # GUI の exe（インストール不要の 1 ファイル）を成果物に置く。テストの後に続けると Windows のジョブが 2〜3 分
  # 延びるので別のジョブで並行に。PR では ci プロファイル、main への push では配る形の release
  gui-windows:
    runs-on: windows-latest
    env:
      # テストと同じく同梱の rust-lld でリンクする（配る release の exe も。#66 で release を PC で起動し、--tour が通るのを確かめた）
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: rust-lld
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - if: github.event_name != 'push'
        run: cargo build --profile ci -p lensbench-gui
      - if: github.event_name == 'push'
        run: |
          cargo build --release -p lensbench-gui
          mkdir -p target/ci
          cp target/release/lensbench-gui.exe target/ci/
        shell: bash
      - uses: actions/upload-artifact@v6
        with:
          name: lensbench-gui-windows
          path: target/ci/lensbench-gui.exe

  # ドキュメントサイト（mdBook）: CLI の例を実際に走らせて図を作り、本が組めるかを確かめる（GUI の画面・Rust API は Pages で）
  docs:
    needs: pr-tested
    if: ${{ !cancelled() && needs.pr-tested.outputs.skip != 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.4.52
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install numpy matplotlib
      - run: cargo build --profile ci -p lensbench-cli
      - run: python scripts/gen_docs.py --cli target/ci/lensbench
      - run: python scripts/docs_examples.py target/ci/lensbench
      - run: mdbook build -d target/book

  # GUI の画面の通し確認: 仮想ディスプレイで起動し、開く → 解析 → カタログ → 組合せ → 系 → 解析を
  # 自分で操作して各画面を撮る。途中でエラーが出れば失敗。画面は成果物 gui-tour に置く
  gui-tour:
    needs: pr-tested
    if: ${{ !cancelled() && needs.pr-tested.outputs.skip != 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: .github/scripts/apt_install.sh xvfb libxkbcommon-x11-0 libgl1 libegl1 libgl1-mesa-dri fonts-noto-cjk
      - run: cargo build --profile ci -p lensbench-gui
      - run: >-
          xvfb-run -a -s "-screen 0 1400x900x24"
          target/ci/lensbench-gui --tour gui-tour
          --glass-dir tests/glass --lens-catalog examples/lenses/LB examples/projects/P8_catalog_two.json
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: gui-tour
          path: gui-tour

  # 書き出しの読み戻し: CLI で書いた SVG・glTF・STEP・CSV・JSON を別の実装（XML・trimesh・OpenCascade）で
  # 読み、形・座標（GLRS）・追跡の値を .zmx と OpticStudio の基準（tests/refs）と照合する
  export-readback:
    needs: pr-tested
    if: ${{ !cancelled() && needs.pr-tested.outputs.skip != 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --profile ci -p lensbench-cli
      - run: python -m pip install -r tests/readback/requirements.txt
      - run: python -m pytest -q tests/readback

  # Web 版: wasm でビルドし、配る形のフォルダを作って Chromium で起動を確かめる。フォルダは成果物
  # lensbench-web（GitHub Pages への公開は pages.yml）
  web:
    needs: pr-tested
    if: ${{ !cancelled() && needs.pr-tested.outputs.skip != 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      # スレッドありの版（mt/）は nightly の build-std で作る（scripts/build_web.sh の NIGHTLY と同じ版）
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-15
          targets: wasm32-unknown-unknown
          components: rust-src
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, wasm32-wasip1
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # wasm-bindgen-cli は Cargo.lock の wasm-bindgen と同じ版
      - run: |
          v=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')
          echo "WASM_BINDGEN=$v" >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@${{ env.WASM_BINDGEN }}
      - run: cargo clippy --target wasm32-unknown-unknown -p lensbench-web -p lensbench-gui -- -D warnings
      # simd128 の経路（AᵀA の gram_block_simd128 など）: core を wasm32-wasip1 ＋ simd128 で検査（#28）
      - run: cargo clippy -p lensbench-core --target wasm32-wasip1 --all-targets -- -D warnings
        env:
          RUSTFLAGS: -C target-feature=+simd128
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install fonttools
      - run: scripts/build_web.sh target/web
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      # gram_block_simd128 が gram_tiles とビットまで同じこと（試験 1 本を Node の WASI で。#28）
      - run: cargo test -p lensbench-core --lib --target wasm32-wasip1 column_basis_and_gram_match_the_row_forms
        env:
          RUSTFLAGS: -C target-feature=+simd128
          CARGO_TARGET_WASM32_WASIP1_RUNNER: node ${{ github.workspace }}/scripts/wasi_run.mjs
      # まとめ追跡（wasm は f64x2 を名指し、8 本ずつ）が 1 本ずつの追跡とビットまで同じこと（#99）
      - run: cargo test --release -p lensbench-core --target wasm32-wasip1 --test batch
        env:
          RUSTFLAGS: -C target-feature=+simd128
          CARGO_TARGET_WASM32_WASIP1_RUNNER: node ${{ github.workspace }}/scripts/wasi_run.mjs
      - run: npm install --no-save playwright@1.55.0 && npx playwright install chromium
      # スレッドあり（ヘッダーあり）・GitHub Pages と同じ（ヘッダーなし、coi.js で付け直す）・1 スレッド（?st）
      - run: EXPECT_MT=1 node scripts/web_smoke.mjs target/web web-smoke.png
      - run: HEADERS=0 EXPECT_MT=1 node scripts/web_smoke.mjs target/web web-smoke-coi.png
      - run: ST=1 node scripts/web_smoke.mjs target/web web-smoke-st.png
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lensbench-web
          path: |
            target/web
            web-smoke*.png

  python:
    needs: pr-tested
    if: ${{ !cancelled() && needs.pr-tested.outputs.skip != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            crates/lensbench-py -> target
      - run: cargo fmt --manifest-path crates/lensbench-py/Cargo.toml --check
      - run: cargo clippy --manifest-path crates/lensbench-py/Cargo.toml --all-targets -- -D warnings
      - run: cargo build --release -p lensbench-cli
      - run: python -m pip install "maturin>=1.9,<2" numpy pytest mypy
      - run: maturin build --release -m crates/lensbench-py/Cargo.toml -o dist
      - run: python -m pip install --no-index --find-links dist lensbench
      - run: python -m pytest -q crates/lensbench-py/tests
      # 型スタブ: 実行時のモジュールとの照合と、例題の型検査
      - run: python -m mypy.stubtest lensbench --allowlist crates/lensbench-py/stubtest-allowlist.txt
      - run: python -m mypy --strict examples/python
      # serve の Python クライアントと解析ループの例。例は 1 回の往復の時間を出す
      - run: python -m pytest -q clients/python/tests
      - run: python examples/loop/serve_loop.py
      - uses: actions/upload-artifact@v6
        with:
          name: wheel-${{ matrix.os }}
          path: dist/*.whl
