name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  # main への push で、マージした PR の CI の結果を見る（pr-tested）
  actions: read
  pull-requests: read

# 同じ PR に新しい push があれば古い run を取り消す（main の run は取り消さない）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # main への push（PR のマージ）で、マージした結果の木が PR の head の木と同じ（PR が main に追いついていた）で、
  # その head の PR の CI が通っていれば、同じ中身の検査（test・docs・gui-tour・export-readback・web・python）を
  # もう一度回さない。main が先に進んでいて組み合わせが PR で試されていないときは全部回す。
  # 履歴の検査（public-check）と配る exe のビルド（gui-windows）はいつも回す
  pr-tested:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          # 判定に失敗したら（API の失敗など）飛ばさずに全部回す
          check() {
            local tree before head
            tree=$(gh api "repos/$REPO/commits/$SHA" --jq .commit.tree.sha) || return 1
            before=$(gh api "repos/$REPO/commits/$SHA" --jq '.parents[0].sha') || return 1
            # Cargo の依存・設定・ツールチェーンが変わったマージは全部回して main のキャッシュを作り直す（飛ばすと main の
            # キャッシュが古いままになり、以後の PR が毎回作り直す。#216 BLD-12）
            changed=$(gh api --paginate "repos/$REPO/compare/$before...$SHA" --jq '.files[].filename') || return 1
            if grep -qE '(^|/)(Cargo\.lock|Cargo\.toml|rust-toolchain(\.toml)?)$|^\.cargo/' <<<"$changed"; then
              echo "::notice::Cargo の依存・設定が変わったので、全部回して main のキャッシュを保存し直す"
              return 1
            fi
            for head in $(gh api "repos/$REPO/commits/$SHA/pulls" --jq '.[].head.sha') ; do
              [ "$(gh api "repos/$REPO/commits/$head" --jq .commit.tree.sha)" = "$tree" ] || continue
              # マージ前の main の先端が head の祖先（PR が main に追いついていた）。PR の CI が試した
              # 「その時の main と head のマージ」の木が head の木と同じになる条件（後で main が戻された場合を除く）
              [ "$(gh api "repos/$REPO/compare/$before...$head" --jq .behind_by)" = 0 ] || continue
              n=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?event=pull_request&status=success&head_sha=$head" --jq .total_count) || continue
              if [ "${n:-0}" -gt 0 ]; then
                echo "::notice::PR の head ${head:0:7} と同じ木で、その CI が通っているので 重複する検査を飛ばす"
                return 0
              fi
            done
            return 1
          }
          if check; then echo "skip=true" >> "$GITHUB_OUTPUT"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi

  public-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          fetch-depth: 0
      - run: python3 scripts/check_public.py --history

  test:
    needs: pr-tested
    if: ${{ !cancelled() && needs.pr-tested.outputs.skip != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      # ツールチェーンは rust-toolchain.toml の版（Windows のリンカ rust-lld は .cargo/config.toml）
      - run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39  # v2.90.3
        with:
          tool: nextest
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # テストは ci プロファイル（release と同じ最適化、LTO なし・オーバーフロー検査あり。Cargo.toml）。
      # nextest で exe をまたいで並べて回す（.config/nextest.toml）。doctest は nextest が回さないので別に
      - run: cargo nextest run --locked --profile ci --cargo-profile ci --workspace
      - run: cargo test --locked --doc --workspace --profile ci

  # GUI の exe（インストール不要の 1 ファイル、配る形の release）を成果物に置く。PR も release で作る
  # （rust-cache は main で保存したものしか PR から使えず、main は release なので、PR を ci プロファイルにすると
  # 毎回 7 分の全ビルドになっていた。release なら main のキャッシュに当たる。#216 BLD-11）。テストと並行の別ジョブ
  gui-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
      - run: |
          cargo build --locked --release -p lensbench-gui
          mkdir -p target/ci
          cp target/release/lensbench-gui.exe target/ci/
        shell: bash
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: lensbench-gui-windows
          path: target/ci/lensbench-gui.exe

  # ドキュメントサイト（mdBook）と GUI の画面の通し確認: scripts/build_docs.sh が CLI の例を走らせて図を作り、
  # 仮想ディスプレイで GUI を起動して、開く → 解析 → カタログ → 組合せ → 系 → 解析を自分で操作して各画面を撮り
  # （途中でエラーが出れば失敗）、本と Rust API（cargo doc）を組む。本は成果物 site-book（Pages はそれを載せる）、
  # 画面は gui-tour
  docs:
    needs: pr-tested
    if: ${{ !cancelled() && needs.pr-tested.outputs.skip != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39  # v2.90.3
        with:
          tool: mdbook@0.4.52
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.13"
      - run: python -m pip install numpy matplotlib
      # apt で入れる包みの deb を保存して、Ubuntu のミラーが引けないときはそこから入れる（apt_install.sh）。
      # 像の版ごとに鍵を分ける（像の更新で版が合わなくなったら取りに行き、新しい鍵で保存し直す）
      - run: echo "APT_DEB_KEY=apt-debs-gui-${{ runner.arch }}-$ImageOS-$ImageVersion" >> "$GITHUB_ENV"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ~/.cache/apt-debs
          key: ${{ env.APT_DEB_KEY }}
          restore-keys: apt-debs-gui-${{ runner.arch }}-
      - run: .github/scripts/apt_install.sh xvfb libxkbcommon-x11-0 libgl1 libegl1 libgl1-mesa-dri fonts-noto-cjk
        timeout-minutes: 20
      - run: scripts/build_docs.sh target/book
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: site-book
          path: target/book
      - if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: gui-tour
          path: target/docs-gui-tour

  # 書き出しの読み戻し: CLI で書いた SVG・glTF・STEP・CSV・JSON を別の実装（XML・trimesh・OpenCascade）で
  # 読み、形・座標（GLRS）・追跡の値を .zmx と OpticStudio の基準（tests/refs）と照合する
  export-readback:
    needs: pr-tested
    if: ${{ !cancelled() && needs.pr-tested.outputs.skip != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - run: rustup toolchain install && rustc --version
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.13"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
      - run: cargo build --locked --profile ci -p lensbench-cli
      - run: python -m pip install -r tests/readback/requirements.txt
      - run: python -m pytest -q tests/readback

  # Web 版: wasm でビルドし、配る形のフォルダを作って Chromium で起動を確かめる。フォルダは成果物
  # lensbench-web（GitHub Pages への公開は pages.yml）
  web:
    needs: pr-tested
    if: ${{ !cancelled() && needs.pr-tested.outputs.skip != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      # スレッドありの版（mt/）は nightly の build-std で作る（版は scripts/build_web.sh の NIGHTLY）。
      # 1 スレッドの版と検査は rust-toolchain.toml の版
      - run: |
          nightly=$(grep -oE 'nightly-[0-9]{4}-[0-9]{2}-[0-9]{2}' scripts/build_web.sh | head -1)
          rustup toolchain install "$nightly" --profile minimal -c rust-src -t wasm32-unknown-unknown
          rustup toolchain install
          rustup target add wasm32-unknown-unknown wasm32-wasip1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
      # wasm-opt（binaryen）。無いと build_web.sh が黙って飛ばしていた（REQUIRE_WASM_OPT で失敗にする。#216 BLD-17）
      - run: |
          v=version_123
          curl -sSfL "https://github.com/WebAssembly/binaryen/releases/download/$v/binaryen-$v-x86_64-linux.tar.gz" | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-$v/bin" >> "$GITHUB_PATH"
      # wasm-bindgen-cli は Cargo.lock の wasm-bindgen と同じ版
      - run: |
          v=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')
          echo "WASM_BINDGEN=$v" >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39  # v2.90.3
        with:
          tool: wasm-bindgen-cli@${{ env.WASM_BINDGEN }}
      - run: cargo clippy --locked --target wasm32-unknown-unknown -p lensbench-web -p lensbench-gui -- -D warnings
      # simd128 の経路（AᵀA の gram_block_simd128 など）: core を wasm32-wasip1 ＋ simd128 で検査（#28）
      - run: cargo clippy --locked -p lensbench-core --target wasm32-wasip1 --all-targets -- -D warnings
        env:
          RUSTFLAGS: -C target-feature=+simd128
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"
      - run: python -m pip install fonttools
      - run: REQUIRE_WASM_OPT=1 scripts/build_web.sh target/web
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6.5.0
        with:
          node-version: "22"
      # wasm32-wasip1 の試験は wasmtime で回す（Node 22 の WASI は .wasm によって SIGSEGV で落ち続けることがあり、
      # 手元では再現しない。#181）。試験は env!("CARGO_MANIFEST_DIR") からの絶対パスで tests/ を読むので、
      # リポジトリの根を同じパスで見せる
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39  # v2.90.3
        with:
          tool: wasmtime@29.0.1
      # gram_block_simd128 が gram_tiles とビットまで同じこと（試験 1 本を WASI で。#28）
      - run: cargo test -p lensbench-core --lib --target wasm32-wasip1 column_basis_and_gram_match_the_row_forms
        env:
          RUSTFLAGS: -C target-feature=+simd128
          CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime run --dir . --dir ${{ github.workspace }}::${{ github.workspace }}
      # まとめ追跡（wasm は f64x2 を名指し、8 本ずつ）が 1 本ずつの追跡とビットまで同じこと（#99）
      - run: cargo test --release -p lensbench-core --target wasm32-wasip1 --test batch
        env:
          RUSTFLAGS: -C target-feature=+simd128
          CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime run --dir . --dir ${{ github.workspace }}::${{ github.workspace }}
      - run: npm install --no-save playwright@1.55.0 && npx playwright install chromium
      # スレッドあり（ヘッダーあり）・GitHub Pages と同じ（ヘッダーなし、coi.js で付け直す）・1 スレッド（?st）
      - run: EXPECT_MT=1 node scripts/web_smoke.mjs target/web web-smoke.png
      - run: HEADERS=0 EXPECT_MT=1 node scripts/web_smoke.mjs target/web web-smoke-coi.png
      - run: ST=1 node scripts/web_smoke.mjs target/web web-smoke-st.png
      - if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: lensbench-web
          path: |
            target/web
            web-smoke*.png

  python:
    needs: pr-tested
    # main への push では検査を飛ばす run でも回す（配る形の release の wheel を成果物に置くため）
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.pr-tested.outputs.skip != 'true') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      # PR は ci プロファイル（LTO なし）、配る wheel を作る main への push は release（#216 BLD-16）
      P: ${{ github.event_name == 'push' && 'release' || 'ci' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - run: rustup toolchain install && rustc --version
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"
      # crates/lensbench-py はワークスペースのメンバー（fmt・clippy は test ジョブで一緒に見る）
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
      - run: cargo build --locked --profile "$P" -p lensbench-cli
      - run: |
          exe="$PWD/target/$P/lensbench"
          if [ "$RUNNER_OS" = Windows ]; then exe=$(cygpath -m "$exe.exe"); fi
          echo "LENSBENCH_CLI=$exe" >> "$GITHUB_ENV"
          echo "LENSBENCH_EXE=$exe" >> "$GITHUB_ENV"
      - run: python -m pip install "maturin>=1.9,<2" numpy pytest mypy
      - run: maturin build --locked --profile "$P" -m crates/lensbench-py/Cargo.toml -o dist
      - run: python -m pip install --no-index --find-links dist lensbench
      - run: python -m pytest -q crates/lensbench-py/tests
      # 型スタブ: 実行時のモジュールとの照合と、例題の型検査
      - run: python -m mypy.stubtest lensbench --allowlist crates/lensbench-py/stubtest-allowlist.txt
      - run: python -m mypy --strict examples/python
      # serve の Python クライアントと解析ループの例。例は 1 回の往復の時間を出す
      - run: python -m pytest -q clients/python/tests
      - run: python examples/loop/serve_loop.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: wheel-${{ matrix.os }}
          path: dist/*.whl
