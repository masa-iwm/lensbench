# 追跡の速さを 2 つの版で比べる（手動のみ）。同じランナーで base と head を交互に測るので、
# ランナーごとの速さの差は比に入らない。共有 VM なので 1 回ごとに 1〜2 割ぶれる → ラウンドの中央値で見る。
# 数 % の差の判定には向かない。結果は Job Summary と成果物 bench-<os>
name: Bench

on:
  workflow_dispatch:
    inputs:
      base:
        description: 比べる元の ref（ブランチ・タグ・commit）
        default: main
      head:
        description: 比べる先の ref（空なら実行したブランチ）
        default: ""
      os:
        description: ランナー
        type: choice
        options: [both, windows-latest, ubuntu-24.04]
        default: both
      systems:
        description: tests/refs の系（all か A0,C0 のような並び）
        default: all
      threads:
        description: スレッド数（カンマ区切り）
        default: "1,4"
      rounds:
        description: ラウンド数（中央値を取る）
        default: "5"

permissions:
  contents: read

jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os == 'both' && '["windows-latest","ubuntu-24.04"]' || format('["{0}"]', inputs.os)) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      # 比べるスクリプトと系（tests/refs）は実行したブランチのものを使う（古い版には無いことがある）。
      # base・head は全履歴から worktree にする（短い SHA も使えるように。checkout の ref は完全な SHA が要る）
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          path: tool
          fetch-depth: 0
      - name: worktrees
        shell: bash
        env:
          BASE: ${{ inputs.base }}
          HEAD_REF: ${{ inputs.head || github.sha }}
        run: |
          rev() { git -C tool rev-parse --verify -q "origin/$1^{commit}" || git -C tool rev-parse --verify "$1^{commit}"; }
          git -C tool worktree add --detach ../base "$(rev "$BASE")"
          git -C tool worktree add --detach ../head "$(rev "$HEAD_REF")"
      # 各 worktree に rust-toolchain.toml があればその版（rustup が入れる）。無い古い版は stable
      - run: rustup toolchain install stable --profile minimal
      - name: build
        shell: bash
        run: |
          for w in base head; do
            (cd $w && echo "$w $(git rev-parse --short HEAD)" && cargo build --release --example bench -p lensbench-core)
            echo "${w^^}_REV=$(cd $w && git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          done
          nproc 2>/dev/null || echo "$NUMBER_OF_PROCESSORS"
      - name: run
        shell: bash
        # 入力はシェルに直に展開せず env で渡す（#216 BLD-18）
        env:
          SYSTEMS: ${{ inputs.systems }}
          THREADS: ${{ inputs.threads }}
          ROUNDS: ${{ inputs.rounds }}
          BASE_LABEL: ${{ inputs.base }}
          HEAD_LABEL: ${{ inputs.head || github.ref_name }}
        run: |
          ext=""; py=python3; [ "$RUNNER_OS" = Windows ] && ext=.exe && py=python
          $py tool/scripts/bench_compare.py \
            --base "base/target/release/examples/bench$ext" \
            --head "head/target/release/examples/bench$ext" \
            --refs tool/tests/refs \
            --systems "$SYSTEMS" --threads "$THREADS" --rounds "$ROUNDS" \
            --base-label "$BASE_LABEL ($BASE_REV)" --head-label "$HEAD_LABEL ($HEAD_REV)" \
            --out bench.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: bench-${{ matrix.os }}
          path: bench.json
