# GitHub Pages に公開する。main の CI が通ったら（と手動）。初回だけ、リポジトリの Settings → Pages → Source を「GitHub Actions」にする。
#   /      ドキュメント（mdBook。scripts/build_docs.sh）。/api/rust/ に cargo doc
#   /app/  Web 版（公開側のビルド: 同梱は公開用の見本だけ。docs/web.md）
# 中身は CI が作って検査した成果物（docs ジョブの site-book、web ジョブの lensbench-web）をそのまま載せる
# （同じものを作り直さない・検査したものと載せるものを同じにする。#216 BLD-21）。main の CI が「PR と同じ木」で
# 検査を飛ばしたときは、その PR の CI の成果物を使う。どちらも取れなければ（手動実行・成果物の期限切れ）ここで作る
name: Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      # CI の成果物を取る
      actions: read
      pull-requests: read
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      # 成果物のある CI の run を探す: その run か、検査を飛ばしたならマージした PR の head の成功した run
      - id: src
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.event.workflow_run.id }}
        run: |
          has() { gh api "repos/$REPO/actions/runs/$1/artifacts?per_page=100" --jq '[.artifacts[] | select(.expired | not) | .name]' \
            | grep -q '"site-book"' && gh api "repos/$REPO/actions/runs/$1/artifacts?per_page=100" \
            --jq '[.artifacts[] | select(.expired | not) | .name]' | grep -q '"lensbench-web"'; }
          run=""
          if has "$RUN"; then run=$RUN
          else
            tree=$(gh api "repos/$REPO/commits/$SHA" --jq .commit.tree.sha)
            for head in $(gh api "repos/$REPO/commits/$SHA/pulls" --jq '.[].head.sha'); do
              [ "$(gh api "repos/$REPO/commits/$head" --jq .commit.tree.sha)" = "$tree" ] || continue
              for r in $(gh api "repos/$REPO/actions/workflows/ci.yml/runs?event=pull_request&status=success&head_sha=$head" --jq '.workflow_runs[].id'); do
                if has "$r"; then run=$r; break 2; fi
              done
            done
          fi
          echo "成果物の run: ${run:-なし（ここで作る）}"
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - if: steps.src.outputs.run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ steps.src.outputs.run }}
        run: |
          gh run download "$RUN" -R "$GITHUB_REPOSITORY" -n site-book -D target/site
          gh run download "$RUN" -R "$GITHUB_REPOSITORY" -n lensbench-web -D target/webart
          mv target/webart/target/web target/site/app
          ls target/site target/site/app
      - if: steps.src.outputs.run == ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ env.SHA }}
      # スレッドありの版（mt/）は nightly の build-std で作る（scripts/build_web.sh の NIGHTLY と同じ版）
      - if: steps.src.outputs.run == ''
        run: |
          nightly=$(grep -oE 'nightly-[0-9]{4}-[0-9]{2}-[0-9]{2}' scripts/build_web.sh | head -1)
          rustup toolchain install "$nightly" --profile minimal -c rust-src -t wasm32-unknown-unknown
          rustup toolchain install
          rustup target add wasm32-unknown-unknown
          v=version_123
          curl -sSfL "https://github.com/WebAssembly/binaryen/releases/download/$v/binaryen-$v-x86_64-linux.tar.gz" | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-$v/bin" >> "$GITHUB_PATH"
      - if: steps.src.outputs.run == ''
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
      # wasm-bindgen-cli は Cargo.lock の wasm-bindgen と同じ版
      - if: steps.src.outputs.run == ''
        run: |
          v=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')
          echo "WASM_BINDGEN=$v" >> "$GITHUB_ENV"
      - if: steps.src.outputs.run == ''
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39  # v2.90.3
        with:
          tool: wasm-bindgen-cli@${{ env.WASM_BINDGEN }}
      - if: steps.src.outputs.run == ''
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - if: steps.src.outputs.run == ''
        run: python -m pip install fonttools numpy matplotlib
      # ドキュメント: mdBook と、GUI の画面を撮る仮想ディスプレイ
      - if: steps.src.outputs.run == ''
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39  # v2.90.3
        with:
          tool: mdbook@0.4.52
      # apt で入れる包みの deb を保存して、Ubuntu のミラーが引けないときはそこから入れる（apt_install.sh）。
      # 像の版ごとに鍵を分ける（像の更新で版が合わなくなったら取りに行き、新しい鍵で保存し直す）
      - if: steps.src.outputs.run == ''
        run: echo "APT_DEB_KEY=apt-debs-gui-${{ runner.arch }}-$ImageOS-$ImageVersion" >> "$GITHUB_ENV"
      - if: steps.src.outputs.run == ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/apt-debs
          key: ${{ env.APT_DEB_KEY }}
          restore-keys: apt-debs-gui-${{ runner.arch }}-
      - if: steps.src.outputs.run == ''
        run: .github/scripts/apt_install.sh xvfb libxkbcommon-x11-0 libgl1 libegl1 libgl1-mesa-dri fonts-noto-cjk
        timeout-minutes: 20
      - if: steps.src.outputs.run == ''
        run: scripts/build_docs.sh target/site
      - if: steps.src.outputs.run == ''
        run: REQUIRE_WASM_OPT=1 scripts/build_web.sh target/site/app
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: target/site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # 書き込みの権限は配備のジョブだけに渡す（ビルドのジョブでは第三者の action とスクリプトが走る。#216 BLD-18）
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # GitHub 側の syncing_files が既定の 10 分で終わらず止まることがある（11/10 に 2 回）ので 20 分待つ
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
        with:
          timeout: 1200000
